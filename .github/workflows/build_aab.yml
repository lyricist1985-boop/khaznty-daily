name: Build AAB
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - run: cp lib/main.dart /tmp/main.dart
      - run: flutter create --project-name khaznty_daily --org com.khaznty.daily --platforms android .
      - run: cp /tmp/main.dart lib/main.dart
      - run: flutter pub get
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: khaznty-aab
          path: build/app/outputs/bundle/release/app-release.aab
